<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log ind')}"><title></title></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <section class="card">
        <h1>Log ind</h1>

        <p th:if="${error}" th:text="${error}" class="error">Fejl</p>

        <form th:action="@{/login}" method="post">
            <label for="email">E-mail</label>
            <input type="text" id="email" name="email" value="test@test.dk">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" value="1234">

            <button type="submit" class="btn">Log ind</button>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
