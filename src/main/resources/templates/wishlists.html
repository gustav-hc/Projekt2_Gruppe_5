<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mine ønskesedler')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <section class="card">
        <h1>Mine ønskesedler</h1>

        <p th:if="${#lists.isEmpty(wishlists)}">Du har ingen ønskesedler endnu.</p>

        <ul>
            <li th:each="wishlist : ${wishlists}" th:text="${wishlist.title}">Titel</li>
        </ul>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
