<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Delt ønskeseddel')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <section class="card">
        <h1 th:text="${wishlist.title}">Titel</h1>

        <p th:if="${#lists.isEmpty(wishes)}">Ingen ønsker endnu</p>

        <ul class="wish-list">
            <li class="shared-wish-item" th:each="wish : ${wishes}">
                 <a th:text="${wish.name}" th:href="@{/shared/{token}/wishes/{id}(token=${token}, id=${wish.id})}" ></a>
                <span th:if="${wish.price != null}" th:text="${wish.price} + ' kr.'">Pris</span>

                <span th:if="${wish.reserved}" class="reserved-badge">Reserveret</span>

                <form th:unless="${wish.reserved}"
                      th:action="@{/shared/{token}/wishes/{id}/reserve(token=${wishlist.shareToken}, id=${wish.id})}"
                      method="post">
                    <button type="submit" class="btn btn-small">Reservér</button>
                </form>
            </li>
        </ul>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
