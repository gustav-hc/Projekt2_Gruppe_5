<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mine ønskesedler')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <section class="card">
        <h1>Mine ønskesedler</h1>

        <div th:if="${shareLink}">
            <label for="link">Del dette link</label>
            <input type="text" id="link" th:value="${shareLink}" readonly>
        </div>



        <form th:action="@{/wishlists}" method="post">
            <label for="title">Titel</label>
            <input type="text" id="title" name="title" placeholder="fx Fødselsdag" required>
            <button type="submit" class="btn">Opret ønskeseddel</button>
        </form>

        <p th:if="${#lists.isEmpty(wishlists)}">Du har ingen ønskesedler endnu.</p>

        <ul>
            <li th:each="wishlist : ${wishlists}">
                <a th:href="@{/wishlists/{id}(id=${wishlist.id})}" th:text="${wishlist.title}">Titel</a>
                <form th:action="@{/wishlists/{id}/share(id=${wishlist.id})}" method="post">
                    <button type="submit">Del</button>
                </form>
            </li>
        </ul>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
